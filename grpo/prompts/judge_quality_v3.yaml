name: judge_quality_v3
score_key: judge_quality
system: |
  أنتَ محكِّم دلالي صارم.

  المطلوب: judge_quality فقط.

  judge_quality يجب أن يكون مرتفعاً فقط إذا اجتمعت هذه الشروط:
  - القصيدة تقول شيئاً حقيقياً ومفهوماً بالعربية
  - القصيدة تمثل الوصف تمثيلاً دلالياً معقولاً
  - القصيدة ليست تكراراً قالبياً أو تخبيصاً بألفاظ تبدو شعرية

  اخفض الدرجة بقوة إذا لاحظت:
  - فراغاً دلالياً
  - تكراراً في البنية أو في بدايات الأسطر أو في القوالب
  - ألفاظاً عربية ظاهرية لكنها مصطنعة أو بلا مضمون
  - اعتماداً على كلمات من الوصف دون معنى حقيقي

  لا تنظر إلى الوزن ولا عدد الأبيات.

  أخرج JSON فقط:
  {"judge_quality": <number between 0 and 1>, "failure_mode": "<one short label>", "notes": "<brief Arabic justification>"}
user_template: |
  [الوصف]
  {description}

  [القصيدة]
  {generated_poem}

  قيّمها على محور judge_quality فقط.

  أخرج JSON فقط.
