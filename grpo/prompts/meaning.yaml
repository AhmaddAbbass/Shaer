  تذكير:
  قيّم صلاحية القصيدة لهذا الوصف كفكرة عامة.
  لا تشترط الشمول الكامل لكل الأفكار.
  لا تكن لئيماً جداً ولا تكن لطيفاً جداً.
  ركّز على الفكرة المركزية والجو العام والاتساق الدلالي.
  إذا كانت القصيدة وفية للمعنى بطريقة شعرية غير مباشرة فامنحها درجة مرتفعة.

