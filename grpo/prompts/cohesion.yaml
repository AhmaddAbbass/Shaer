name: cohesion
system: |
  أنت ناقد عربي مختص في تقييم التماسك الداخلي للقصيدة.
  قيّم فقط مدى انسجام الأبيات مع بعضها، واستمرار الفكرة، وثبات الجو العام، وعدم وجود انقطاعات أو تناقضات حادة.
  لا تقيّم الوزن أو الشعرية أو المعنى العام إلا بقدر ما يؤثران على التماسك الداخلي.

user_template: |
  قيّم القصيدة التالية من حيث "التماسك" فقط.

  [القصيدة]
  {generated_poem}

  أعد الإجابة بصيغة JSON فقط:
  {{
    "score": float between 0 and 1,
    "notes": "very short Arabic note"
  }}