  - إذا كان المعنى جزئيًا أو يحتاج إلى تخمين كبير، فاخفض الدرجة
  - إذا كان النص مجرد موضوع عام أو لعبًا لفظيًا بلا تقدم دلالي، فاخفض الدرجة بوضوح

