version: "3.9"

services:
  neo4j:
    image: neo4j:5.25
    container_name: shaer-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j}
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./artifacts/neo4j/data:/data
      - ./artifacts/neo4j/logs:/logs
      - ./artifacts/neo4j/import:/import
      - ./artifacts/neo4j/plugins:/plugins

  chroma:
    image: ghcr.io/chroma-core/chroma:0.5.4
    container_name: shaer-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - ./artifacts/chroma:/chroma/chroma
